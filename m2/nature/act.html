<section class="panel" data-lesson="1">
  <h1>자연관 감별</h1>
  <p class="q">자연을 바라보는 관점을 구분하고, 나의 관점을 수직선 위에 찍어 보자.</p>
  <script type="application/json" class="kit">[{"k": "sort", "h": "어떤 관점일까? (206~207쪽)", "bins": ["인간 중심주의", "생태 중심주의", "동양의 자연관"], "cards": [["자연은 인간의 필요를 채우기 위한 수단이다", 0, "도구적 가치"], ["동식물은 모두 인간을 위해 존재한다", 0, "아리스토텔레스"], ["인간은 흙·물·동식물로 이루어진 공동체의 평범한 구성원이다", 1, "레오폴드"], ["자연은 이익과 상관없이 그 자체로 소중하다", 1, "본래적 가치"], ["하늘과 사람이 하나 되는 경지를 지향한다", 2, "유교 — 천인합일"], ["살아 있는 생명을 함부로 죽이지 않는다", 2, "불교 — 불살생"], ["인위적 욕망을 버리고 자연의 순리대로 산다", 2, "도가"]]}, {"k": "line", "h": "나의 자연관은? (207쪽)", "left": "서안 (인간 중심)", "right": "지호 (생태 중심)", "items": ["아무리 아름다운 나무도 인간이 쓰지 않으면 의미 없다", "모기도 그 자체로 존중받아야 한다", "사람에게 필요하면 숲을 깎아 체육관을 지어도 된다"]}, {"k": "write", "h": "서안과 지호의 관점 평가 (207쪽)", "prompts": [["지호의 입장에서 서안의 관점 평가", "쓸모로만 보면 쓸모없어 보이는 생명은 함부로 다뤄진다"], ["서안의 입장에서 지호의 관점 평가", "사람의 생활에 필요한 개발까지 막을 수는 없다"], ["내가 찾은 공존의 방법", "나무를 옮기지 않고 아파트 쪽으로 산책길을 내어 함께 누린다"]]}]</script>
</section>
<section class="panel" data-lesson="2">
  <h1>환경 위기 책임 나누기</h1>
  <p class="q">환경 위기의 특성을 구분하고, 아보카도 한 알의 책임을 나눠 보자.</p>
  <script type="application/json" class="kit">[{"k": "sort", "h": "환경 위기의 어떤 특성일까? (210~211쪽)", "bins": ["자정 능력 초과", "빠른 속도", "넓은 영향 범위"], "cards": [["강이 스스로 깨끗해지기도 전에 폐수가 또 흘러든다", 0, "자정 능력"], ["빙하가 과학자들의 예측보다 빨리 녹는다", 1, "속도"], ["다른 나라의 미세 먼지 때문에 축구 대회가 취소되었다", 2, "국경을 넘는다"], ["지금의 오염이 100년 뒤 아이들의 삶을 위협한다", 2, "미래 세대까지"], ["바다가 받아들일 수 있는 양보다 많은 플라스틱이 버려진다", 0, "자정 능력"]]}, {"k": "rank", "h": "아보카도 만화 — 책임이 큰 순서는? (211쪽)", "items": ["아보카도를 즐겨 사 먹는 소비자", "건강에 좋다고 홍보한 기업", "넓은 땅과 물을 쓰는 농장 주인", "온실가스를 내뿜으며 운송하는 유통업자"]}, {"k": "write", "h": "100년 뒤 (211쪽)", "prompts": [["생태계", "물이 마르고 기온이 올라 숲과 동식물이 사라진다"], ["미래 세대", "폭염과 식량 부족으로 안전하게 살기 어렵다"], ["책임은 누구에게?", "소비자·기업·생산자·유통업자 모두 — 우리 모두에게 있다"]]}, {"k": "ox", "h": "윤리적 책임 OX (212쪽)", "items": [["환경 위기는 정부와 기업만의 책임이다.", false, "우리의 편익을 위한 행동이 쌓인 결과 — 우리 모두에게 책임이 있다."], ["인간은 생태계의 구성원이라는 인식이 필요하다.", true, "생태계에 대한 책임."], ["아직 태어나지 않은 사람에게는 책임이 없다.", false, "미래 세대에 대한 책임."]]}]</script>
</section>
<section class="panel" data-lesson="3">
  <h1>공존 실천 일주일</h1>
  <p class="q">노력의 차원을 구분하고, 일주일 환경 지킴이 캠페인을 계획해 보자.</p>
  <script type="application/json" class="kit">[{"k": "sort", "h": "어떤 차원의 노력일까? (214~215쪽)", "bins": ["지구적", "국가적", "개인적"], "cards": [["여러 나라가 파리 협정을 맺었다", 0, "국제 협약"], ["국제 환경 단체가 위기를 알린다", 0, "국제기구·환경 단체"], ["2050년 탄소 중립을 선언했다", 1, "우리나라"], ["친환경 자동차를 사면 세금을 줄여 준다", 1, "제도"], ["안 쓰는 플러그를 뽑는다", 2, "자원 절약"], ["캔과 페트병을 분리배출한다", 2, "재활용"]]}, {"k": "timer", "min": 2, "label": "교실 탄소 찾기"}, {"k": "write", "h": "환경 지킴이 일주일 계획 (216쪽)", "prompts": [["월~화", "급식 남기지 않기"], ["수~목", "텀블러 들고 다니기"], ["금~일", "가족과 줍깅 30분"], ["동참을 권할 사람과 방법", "동생에게 함께 줍깅을 하자고 제안한다"]]}, {"k": "vote", "h": "우리 반 탄소 중립 실천 하나 고르기 (218~219쪽)", "opts": ["빈 교실 불·에어컨 끄기 당번", "급식 잔반 줄이기", "이면지 쓰기", "텀블러 쓰기"]}]</script>
</section>
