<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수업 진행 도구 · 도덕 수업실</title>
<meta name="theme-color" content="#fff8ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<style>
.page-h{padding-top:22px}.page-h h1{margin:0;font:clamp(28px,4vw,40px)/1.2 var(--disp)}.page-h p{margin:4px 0 0;color:var(--muted);font-size:15px}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}
.panel{background:#fff;border:2px solid var(--line);border-radius:24px;padding:18px 20px}
.panel h2{margin:0 0 6px;font:24px var(--disp)}
.big{font:clamp(64px,11vw,120px)/1.05 var(--disp);text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}
.big.warn{color:var(--coral)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.btn{font:17px var(--disp);border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 16px;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--coral)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff}
.pick{font:clamp(44px,8vw,84px)/1.2 var(--disp);text-align:center;min-height:1.3em;margin:8px 0;color:var(--coral)}
.field{font-size:15px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.field input[type=number]{font:inherit;width:64px;padding:4px 6px;border:2px solid var(--line);border-radius:10px}
textarea{width:100%;min-height:120px;font:16px var(--body);border:2px solid var(--line);border-radius:14px;padding:10px;background:#fff;color:var(--ink)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.groups div{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:16px}
.groups b{display:block;font:20px var(--disp);color:var(--coral);margin-bottom:4px}
.used,.note{font-size:14px;color:var(--muted);text-align:center;min-height:1.2em;margin:6px 0 0}
.fs{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;font:min(30vw,52vh) var(--disp);font-variant-numeric:tabular-nums;cursor:pointer}
.back{display:inline-block;margin-top:16px;font-size:15px;color:var(--muted)}
.roster-p{grid-column:1/-1}
.rhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rhead h2{margin:0 8px 0 0}
.cchips{display:flex;gap:6px;flex-wrap:wrap}
.cchip{font:600 15px var(--body);border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 14px;cursor:pointer;min-height:34px}
.cchip[aria-pressed="true"]{background:color-mix(in srgb,var(--coral) 14%,#fff);border-color:var(--coral);color:#c2321f}
.rcount{margin-left:auto;font-size:14px;color:var(--muted)}
.studs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;margin-top:12px}
.stu{font:16px var(--body);border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 8px;cursor:pointer;text-align:left;min-height:40px}
.stu[aria-pressed="false"]{background:#f3eee9;color:#b3a59c;text-decoration:line-through;border-style:dashed}
.stu.hit{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,#fff)}
.redit{margin-top:10px}.redit[hidden]{display:none}
.redit .row{justify-content:flex-start;margin-top:8px}
.hint{font-size:14px;color:var(--muted);margin:8px 0 0}
.fs.names{font:min(9vw,15vh)/1.25 var(--disp);text-align:center;padding:4vh 4vw;display:grid;place-items:center;overflow:auto}
.fs .gg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,26vw),1fr));gap:2vh 2vw;width:100%;font:min(3.4vw,4.6vh)/1.35 var(--disp)}
.fs .gg div{background:#fff;border-radius:2vh;padding:2vh 2vw;text-align:left}.fs .gg b{display:block;color:var(--coral)}
</style>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<script src="../assets/lessonbar.js" defer></script>
<script src="../assets/marble.js"></script>
</head>
<body>
<header class="topbar"><div class="in"><a class="brand" href="../index.html"><i aria-hidden="true">🌱</i><span>도덕 수업실</span></a></div></header>
<div class="wrap">
  <section class="page-h"><h1>⏱ 수업 진행 도구</h1><p>반을 고르면 그 반 명단으로 발표자 뽑기 · 모둠 편성을 해요. 오늘 없는 학생은 이름을 눌러 빼요.</p></section>
  <div class="tools">
    <section class="panel roster-p" aria-label="우리 반 명단">
      <div class="rhead"><h2>👩‍🎓 우리 반 명단</h2><div class="cchips" id="cchips"></div><span class="rcount" id="rcount"></span><button class="btn" id="rXls" type="button" title="엑셀(.xlsx) · CSV로 여러 반 명단을 한 번에">📥 엑셀로 넣기</button><button class="btn" id="rTpl" type="button" title="반마다 시트가 있는 엑셀 양식">양식 받기</button><button class="btn" id="rEditBtn" type="button">명단 넣기</button></div>
      <div class="studs" id="studs"></div>
      <p class="hint" id="rhint"></p>
      <div class="redit" id="redit" hidden>
        <textarea id="roster" placeholder="한 줄에 한 명씩 (예: 1 김민준). 엑셀·나이스에서 번호와 이름 두 칸을 복사해 그대로 붙여 넣어도 돼요."></textarea>
        <div class="row"><button class="btn primary" id="rSave" type="button">명단 저장</button><button class="btn" id="rCancel" type="button">닫기</button><span class="note" id="rInfo" style="margin:0"></span></div>
      </div>
    </section>
    <section class="panel" aria-label="타이머">
      <h2>⏱ 활동 타이머</h2>
      <div class="big" id="clock">05:00</div>
      <div class="row"><button class="btn" data-m="1">1분</button><button class="btn" data-m="3">3분</button><button class="btn" data-m="5">5분</button><button class="btn" data-m="10">10분</button><button class="btn" data-add="30">+30초</button></div>
      <div class="row" style="margin-top:8px"><button class="btn primary" id="tGo">시작</button><button class="btn" id="tReset">처음으로</button><button class="btn" id="tFull">크게 보기</button></div>
    </section>
    <section class="panel" aria-label="발표자 뽑기">
      <h2>🎲 발표자 뽑기</h2>
      <div class="pick" id="pick">?</div>
      <p class="used" id="used"></p>
      <div class="row"><label class="field">번호 1 ~ <input type="number" id="maxN" min="2" max="60" value="28"></label><label class="field"><input type="checkbox" id="noRep" checked> 뽑힌 사람 빼기</label></div>
      <div class="row" style="margin-top:8px"><button class="btn primary" id="pGo">뽑기</button><button class="btn" id="pReset">처음부터</button></div>
      <div class="row" style="margin-top:8px"><button class="btn primary" id="pRace" type="button">🎱 구슬 레이스로 뽑기</button><button class="btn" id="pFull" type="button">크게 보기</button></div>
      <p class="note" id="pNote">반 명단이 있으면 번호 대신 이름으로 뽑아요(결석 빼고).</p>
    </section>
    <section class="panel" aria-label="모둠 편성" style="grid-column:1/-1">
      <h2>👥 모둠 편성</h2>
      <div class="row" style="justify-content:flex-start;margin-top:8px"><label class="field">모둠 수 <input type="number" id="nG" min="2" max="12" value="6"></label><button class="btn primary" id="gGo">무작위 편성</button><button class="btn" id="gFull" type="button">크게 보기</button><span class="note" id="gInfo" style="margin:0"></span></div>
      <div class="groups" id="groups"></div>
    </section>
  </div>
  <a class="back" href="../index.html">← 도덕 수업실 첫 화면</a>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id), store = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }};
  let AC = null; const beep = (f, d, t0 = 0) => { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + t0; o.frequency.value = f; g.gain.setValueAtTime(.2, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d); } catch (e) {} };
  /* 타이머 */
  let total = 300, left = 300, run = false, last = 0, full = null; const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const show = () => { const s = Math.ceil(left); $('clock').textContent = fmt(s); $('clock').classList.toggle('warn', s <= 10); $('tGo').textContent = run ? '잠깐 멈춤' : '시작'; if (full) { full.textContent = fmt(s); full.style.color = s <= 10 ? 'var(--coral)' : ''; } };
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { total = left = +b.dataset.m * 60; run = false; show(); });
  document.querySelector('[data-add]').onclick = () => { left += 30; total = Math.max(total, left); show(); };
  $('tGo').onclick = () => { if (left <= 0) left = total; run = !run; last = performance.now(); show(); };
  $('tReset').onclick = () => { run = false; left = total; show(); };
  $('tFull').onclick = () => { full = document.createElement('div'); full.className = 'fs'; full.title = '누르면 닫혀요'; full.onclick = () => { full.remove(); full = null; }; document.body.appendChild(full); show(); };
  let lastSec = null; const tick = now => { if (run) { left -= (now - last) / 1000; const s = Math.ceil(left); if (s !== lastSec && s <= 5 && s > 0) beep(660, .15); lastSec = s; if (left <= 0) { left = 0; run = false; beep(880, .4); beep(880, .4, .5); beep(1175, .8, 1); } show(); } last = now; requestAnimationFrame(tick); }; requestAnimationFrame(tick); show();
  /* 명단: 첫 화면 ‘우리 반’의 반마다 저장(Cloudflare에서는 서버, 교사·칠판만 읽음 / 서버가 없으면 이 브라우저). 결석은 오늘 이 기기에서만 */
  const esc = t => String(t).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);
  const LOCAL = !window.ROLE, today = new Date().toISOString().slice(0, 10);
  let PG = {classes: [], rec: {}}, cur = '', away = {};
  try { const v = store.get('moralClass') || ''; cur = v.charAt(0) === '[' ? (JSON.parse(v)[0] || '') : v; cur = store.get('toolClass') || cur; } catch (e) {}
  try { const a = JSON.parse(store.get('toolAway') || '{}'); if (a.d === today) away = a.m || {}; } catch (e) {}
  const cls = () => PG.classes.find(c => c.id === cur);
  const names = () => { const c = cls(); return c && c.roster ? c.roster : []; };
  const present = () => names().filter(n => !(away[cur] || []).includes(n));
  const parse = t => t.split(/\r?\n/).length > 1 || !t.includes(',') ? t.split(/\r?\n/).map(l => l.split('\t').map(x => x.trim()).filter(Boolean).join(' ')).filter(Boolean) : t.split(',').map(x => x.trim()).filter(Boolean);
  function load() {
    if (LOCAL) { try { const j = JSON.parse(store.get('moralProgress') || 'null'); if (j && j.classes) PG = j; } catch (e) {} return Promise.resolve(); }
    return fetch('/teacher/progress').then(r => r.ok ? r.json() : null).then(j => { if (j && j.classes) PG = j; }).catch(() => {});
  }
  function save() {
    if (LOCAL) { store.set('moralProgress', JSON.stringify(PG)); return Promise.resolve(); }
    return fetch('/teacher/progress', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({classes: PG.classes})})
      .then(r => r.json().then(j => { if (!r.ok) throw new Error(j.error || r.status); PG = j; }));
  }
  function paint() {
    const list = PG.classes.slice().sort((a, b) => a.name.localeCompare(b.name, 'ko', {numeric: true})), c = cls(), n = names(), off = away[cur] || [];
    $('cchips').innerHTML = list.map(x => `<button type="button" class="cchip" data-id="${esc(x.id)}" aria-pressed="${x.id === cur}">${esc(x.name)}</button>`).join('');
    $('studs').innerHTML = n.map(x => `<button type="button" class="stu" data-n="${esc(x)}" aria-pressed="${!off.includes(x)}" title="누르면 오늘 결석/출석">${esc(x)}</button>`).join('');
    $('rcount').textContent = n.length ? `오늘 ${present().length} / ${n.length}명` : '';
    $('rEditBtn').hidden = !c; $('rEditBtn').textContent = n.length ? '명단 고치기' : '명단 넣기';
    $('rhint').textContent = !PG.classes.length ? '첫 화면 ‘우리 반’에서 ＋로 반을 만들면 여기서 반마다 명단을 넣을 수 있어요. 명단이 없으면 번호로 뽑아요.' : !c ? '반을 고르세요.' : !n.length ? '[명단 넣기]로 이 반 학생 이름을 넣어요. 엑셀에서 번호·이름 두 칸을 복사해 붙여 넣어도 돼요.' : '이름을 누르면 오늘 결석으로 빠져요(다시 누르면 돌아옴). 뽑기와 모둠 편성은 출석한 학생만.';
    $('pNote').textContent = n.length ? `${c.name} 출석 ${present().length}명 중에서 뽑아요.` : '반 명단이 있으면 번호 대신 이름으로 뽑아요(결석 빼고).';
    $('maxN').closest('label').hidden = !!n.length;
  }
  $('cchips').onclick = e => { const b = e.target.closest('[data-id]'); if (!b) return; cur = cur === b.dataset.id ? '' : b.dataset.id; store.set('toolClass', cur); pool = null; used = []; $('used').textContent = ''; $('pick').textContent = '?'; $('redit').hidden = true; paint(); };
  $('studs').onclick = e => { const b = e.target.closest('[data-n]'); if (!b) return; const a = away[cur] = away[cur] || [], i = a.indexOf(b.dataset.n); i > -1 ? a.splice(i, 1) : a.push(b.dataset.n); store.set('toolAway', JSON.stringify({d: today, m: away})); pool = null; paint(); };
  $('rEditBtn').onclick = () => { $('redit').hidden = !$('redit').hidden; $('roster').value = names().join('\n'); $('rInfo').textContent = ''; if (!$('redit').hidden) $('roster').focus(); };
  $('rCancel').onclick = () => { $('redit').hidden = true; };
  $('roster').oninput = () => { $('rInfo').textContent = parse($('roster').value).length + '명'; };
  $('rSave').onclick = () => {
    const c = cls(); if (!c) return; c.roster = parse($('roster').value).slice(0, 60); $('rSave').disabled = true;
    save().then(() => { $('redit').hidden = true; pool = null; paint(); }).catch(e => alert('명단을 저장하지 못했어요: ' + e.message)).then(() => { $('rSave').disabled = false; });
  };
  load().then(() => { if (!cls()) cur = ''; paint(); });
  /* 엑셀로 명단 넣기: 시트 이름 = 반 이름(예: 2-3)이면 그 반에, ‘반’ 열이 있으면 줄마다 그 반에, 둘 다 아니면 지금 고른 반에.
     ‘이름’(또는 ‘성명’) 열과 ‘번호’ 열을 찾아 ‘3 김민준’처럼 넣음. 없는 반은 새로 만듦. 엑셀 도구(SheetJS)는 누를 때만 불러옴 */
  const xlsx = () => window.XLSX ? Promise.resolve() : new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload = ok; sc.onerror = () => no(new Error('엑셀 도구를 불러오지 못했어요(인터넷 연결 확인)')); document.head.appendChild(sc); });
  const flat = t => String(t || '').replace(/\s/g, '');
  const findCls = (name, ban, grade) => PG.classes.find(c => flat(c.name) === flat(name)) || (ban ? PG.classes.find(c => grade ? flat(c.name) === grade + '-' + ban : c.name.split('-').pop() === String(ban)) : null);
  $('rTpl').onclick = () => xlsx().then(() => {
    const wb = XLSX.utils.book_new(), list = PG.classes.length ? PG.classes.slice().sort((a, b) => a.name.localeCompare(b.name, 'ko', {numeric: true})) : [{name: '2-1', roster: []}];
    list.forEach(c => {
      const rows = [['번호', '이름']], have = (c.roster || []).map(x => { const m = String(x).match(/^(\d+)\s+(.+)$/); return m ? [+m[1], m[2]] : ['', x]; });
      for (let i = 0; i < Math.max(30, have.length); i++) rows.push(have[i] || [i + 1, '']);
      const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols'] = [{wch: 6}, {wch: 14}];
      XLSX.utils.book_append_sheet(wb, ws, String(c.name).replace(/[\\/?*[\]:]/g, '').slice(0, 31) || '반');
    });
    XLSX.writeFile(wb, '학생명단_양식.xlsx');
  }).catch(e => alert(e.message));
  $('rXls').onclick = () => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xlsx,.xls,.csv';
    inp.onchange = () => { const f = inp.files[0]; if (!f) return; xlsx().then(() => f.arrayBuffer()).then(buf => {
      const wb = XLSX.read(buf, {type: 'array'}), got = {}, fresh = [];
      wb.SheetNames.forEach(sn => {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header: 1, defval: ''}).map(r => r.map(x => String(x).trim()));
        let h = rows.findIndex(r => r.some(x => /이름|성명/.test(x))), col = {};
        if (h > -1) rows[h].forEach((x, i) => { if (/이름|성명/.test(x) && col.name == null) col.name = i; else if (/번호/.test(x) && col.num == null) col.num = i; else if (/^(학?반)$/.test(x)) col.ban = i; else if (/학년/.test(x)) col.grade = i; });
        rows.slice(h + 1).forEach(r => {
          let num = '', name = '';
          if (col.name != null) { name = r[col.name]; num = col.num != null ? r[col.num] : ''; }
          else { const v = r.filter(Boolean); if (/^\d+$/.test(v[0]) && v[1]) { num = v[0]; name = v[1]; } else name = v[0] || ''; }
          if (!name || /이름|성명/.test(name)) return;
          let c = col.ban != null && r[col.ban] ? findCls('', String(r[col.ban]).replace(/\D/g, ''), col.grade != null ? String(r[col.grade]).replace(/\D/g, '') : '') : findCls(sn);
          let key = c ? c.id : col.ban != null && r[col.ban] ? (col.grade != null ? String(r[col.grade]).replace(/\D/g, '') + '-' : '') + String(r[col.ban]).replace(/\D/g, '') : wb.SheetNames.length > 1 && /\d/.test(sn) ? sn.trim() : cur;
          if (!key) return;
          if (!c && !PG.classes.find(x => x.id === key) && !fresh.includes(key)) fresh.push(key);
          (got[key] = got[key] || []).push((num ? num + ' ' : '') + name);
        });
      });
      const keys = Object.keys(got);
      if (!keys.length) return alert(cur || wb.SheetNames.length > 1 ? '이름을 찾지 못했어요. ‘이름’ 열이 있는지 확인하거나 [양식 받기]로 받은 파일에 넣어 주세요.' : '먼저 위에서 반을 고르거나, 시트 이름을 반 이름(예: 2-3)으로 해 주세요.');
      const label = k => (PG.classes.find(c => c.id === k) || {name: k}).name;
      if (!confirm(keys.map(k => `${label(k)} ${got[k].length}명${fresh.includes(k) ? ' (새 반)' : ''}`).join('\n') + '\n\n이대로 넣을까요? 원래 명단은 바뀌어요.')) return;
      const bk = (PG.classes[0] || {}).book || 'm1';
      keys.forEach((k, i) => { let c = PG.classes.find(x => x.id === k); if (!c) { c = {id: 'c' + (Date.now() + i).toString(36), name: k.slice(0, 20), book: bk}; PG.classes.push(c); } c.roster = got[k].slice(0, 60); if (!cur) cur = c.id; });
      return save().then(() => { pool = null; paint(); });
    }).catch(e => alert('엑셀을 읽지 못했어요: ' + e.message)); };
    inp.click();
  };
  /* 뽑기 */
  let pool = null, used = []; const all = () => { const r = present(); return names().length ? r : Array.from({length: Math.max(2, +$('maxN').value || 28)}, (_, i) => String(i + 1) + '번'); };
  $('maxN').oninput = () => { pool = null; used = []; $('used').textContent = ''; };
  $('pReset').onclick = () => { pool = null; used = []; $('used').textContent = ''; $('pick').textContent = '?'; document.querySelectorAll('.stu.hit').forEach(x => x.classList.remove('hit')); };
  let pFull = null;
  $('pGo').onclick = () => { if (!pool || !$('noRep').checked) pool = all().filter(x => !$('noRep').checked || !used.includes(x)); if (!pool.length) { pool = all(); used = []; } const nm = all(); if (!nm.length) { $('pick').textContent = '?'; return; } let k = 0; const spin = setInterval(() => { const t = nm[Math.floor(Math.random() * nm.length)]; $('pick').textContent = t; if (pFull) pFull.textContent = t; beep(400 + Math.random() * 300, .04); if (++k > 14) { clearInterval(spin); const i = Math.floor(Math.random() * pool.length), who = pool.splice(i, 1)[0]; if ($('noRep').checked) used.push(who); $('pick').textContent = who; if (pFull) pFull.textContent = who; beep(988, .3); $('used').textContent = used.length ? `뽑힌 순서: ${used.join(' → ')}` : ''; document.querySelectorAll('.stu').forEach(x => x.classList.toggle('hit', used.includes(x.dataset.n))); } }, 60); };
  // 🎱 구슬 레이스: 남은 사람(뽑힌 사람 빼기 켜면) 구슬로 경주 → 1등이 뽑힘. [다시 굴리기]하면 앞 결과는 취소
  $('pRace').onclick = () => {
    if (!pool || !$('noRep').checked) pool = all().filter(x => !$('noRep').checked || !used.includes(x)); if (!pool.length) { pool = all(); used = []; }
    if (pool.length < 2) { if (pool.length) $('pGo').click(); return; }
    const racers = pool.slice(); let prev = null;
    MarbleRace(racers, who => {
      if (prev !== null) { const k = used.lastIndexOf(prev); if (k > -1) used.splice(k, 1); if (!pool.includes(prev)) pool.push(prev); }
      prev = who; const i = pool.indexOf(who); if ($('noRep').checked && i > -1) { pool.splice(i, 1); used.push(who); }
      $('pick').textContent = who; $('used').textContent = used.length ? `뽑힌 순서: ${used.join(' → ')}` : '';
      document.querySelectorAll('.stu').forEach(x => x.classList.toggle('hit', used.includes(x.dataset.n)));
    });
  };
  $('pFull').onclick = () => { pFull = document.createElement('div'); pFull.className = 'fs names'; pFull.title = '누르면 다음 사람 뽑기 · 바깥 Esc로 닫기'; pFull.textContent = $('pick').textContent; pFull.onclick = () => $('pGo').click(); document.body.appendChild(pFull); };
  addEventListener('keydown', e => { if (e.key === 'Escape') { if (pFull) { pFull.remove(); pFull = null; } document.querySelectorAll('.fs').forEach(x => x.remove()); full = null; } });
  /* 모둠 */
  $('gGo').onclick = () => { const r = present(); if (r.length < 2) { $('gInfo').textContent = names().length ? '출석한 학생이 2명 이상이어야 해요.' : '먼저 위에서 반을 고르고 명단을 넣어 주세요.'; return; } const n = Math.min(r.length, Math.max(2, +$('nG').value || 4)), a = r.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } const G = Array.from({length: n}, () => []); a.forEach((x, i) => G[i % n].push(x)); $('groups').innerHTML = G.map((g, i) => `<div><b>${i + 1}모둠</b>${g.map(esc).join('<br>')}</div>`).join(''); $('gInfo').textContent = `${cls() ? cls().name + ' ' : ''}${r.length}명 → ${n}모둠`; };
  $('gFull').onclick = () => { if (!$('groups').innerHTML) $('gGo').click(); if (!$('groups').innerHTML) return; const f = document.createElement('div'); f.className = 'fs names'; f.title = '누르면 닫혀요'; f.innerHTML = '<div class="gg">' + $('groups').innerHTML + '</div>'; f.onclick = () => f.remove(); document.body.appendChild(f); };
})();
</script>
</body>
</html>
