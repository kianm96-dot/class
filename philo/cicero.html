window.CHAT=[["p", "Salve! 로마 말로 안녕! 나는 키케로, 로마의 정치가이자 철학자야. 🏛️"], ["p", "나는 나라가 몇몇 사람의 것이 아니라 <b>모두의 것<\/b>이어야 한다고 생각했어. 이걸 공화주의라고 해."], ["term", "공화주의", "나라를 개인의 소유물이 아닌 ‘공공의 것(res publica)’으로 보고, 시민이 공동체를 위한 덕을 갖추는 것을 중시하는 생각."], ["me", "나라 얘기랑 우정이 무슨 상관이에요?"], ["p", "큰 상관이 있지! 시민들이 서로 믿고 돕는 <b>우정<\/b>이 있어야 공동체가 튼튼해지거든. 우정은 나라의 도덕적 기초야."], ["p", "그리고 나는 우정이 신들이 준 최고의 선물이라고 생각해. 🎁 좋은 일은 나누면 두 배, 슬픈 일은 나누면 절반이 되잖아."], ["quiz", "키케로가 생각한 진정한 우정은?", ["무엇이든 다 들어주는 관계", "서로의 부족함을 채우고 옳은 일을 하도록 돕는 관계", "늘 칭찬만 해 주는 관계"], 1, "정답! 진정한 우정은 서로가 더 좋은 사람이 되도록 돕는 관계예요."], ["me", "그럼 친구가 “우리 친구잖아~” 하면서 잘못된 걸 부탁하면요? 😬"], ["p", "바로 그 질문에 내가 『우정에 관하여』에서 답했지."], ["quote", "이것을 우정의 법칙으로 삼아야 하네. 도의에 어긋나는 것은 요구해서도 안 되고, 요구를 받더라도 들어주어서도 안 된다는 것. “친구를 위해서 그랬다”는 변명은 받아들일 수 없네.", "키케로, 『우정에 관하여』에서", "친구 사이라도 옳지 않은 부탁은 하지도, 들어주지도 말자. “친구니까”는 핑계가 될 수 없어요."], ["p", "그리고 하나 더! 친구에게는 솔직하게 <b>충고<\/b>하고, 친구의 충고는 귀담아들어야 해."], ["quote", "우정에는 아첨과 맞장구보다 더 큰 해악이 없네. 한쪽은 바른말을 듣지 않으려 하고, 다른 쪽은 거짓말할 준비가 되어 있다면 그건 결코 우정이 아니네.", "키케로, 『우정에 관하여』에서", "“너 최고야~”만 하는 사이는 진짜 우정이 아니에요. 듣기 싫은 말도 솔직하게 해 줄 수 있어야 해요."], ["ox", "키케로에 따르면 친한 친구라면 옳지 않은 일이라도 함께해 주는 것이 의리다.", false, "아니에요. 도의에 어긋나는 요구는 친구 사이라도 들어주면 안 된다고 했어요."], ["mission", "내가 키케로라면", "“저에게는 초등학생 때부터 단짝인 친구가 있어요. 그런데 지난주부터 친구가 부모님께 거짓말을 하고 학원을 빠지자고 해요. 놀러 가고 싶대요. 우정을 생각하면 들어줘야 할 것 같은데, 옳지 않은 일 같아서 헷갈려요.” — 글쓴이 나고민", "키케로의 관점에서 나고민 님에게 조언해 주세요.", "아무리 친한 친구라도 도의에 어긋나는 부탁은 들어주면 안 돼요. 진정한 우정을 나누려면 친구를 아끼는 마음을 담아 “거짓말하고 빠지는 건 아닌 것 같아”라고 솔직하게 충고해 보세요. 그리고 친구도 그 충고를 받아들여야 해요. 서로 충고를 주고받는 사이가 진짜 친구랍니다."], ["end", "진짜 친구는 잘못된 부탁을 거절하고, 솔직한 충고를 주고받는다."]];
