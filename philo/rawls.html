window.WHO={"id": "rawls", "name": "롤스", "emoji": "🎂", "color": "#22a6a6", "tags": ["정의론", "무지의 베일", "공정으로서의 정의"]};
window.CHAT=[["p", "Hi! 나는 존 롤스야. 평생 ‘정의’ 하나만 연구했지. 『정의론』이라는 책을 썼어. ⚖️"], ["p", "내가 살던 때에는 벤담과 밀의 공리주의, “최대 다수의 최대 행복”이 인기였어."], ["me", "많은 사람이 행복하면 좋은 거 아니에요?"], ["p", "좋지. 그런데 그 ‘다수’에 들지 못한 <b>소수<\/b>는 어떡해? 다수를 위해서라면 소수의 불행은 괜찮은 걸까?"], ["ox", "롤스는 최대 다수의 최대 행복만으로는 소수가 희생될 수 있다고 걱정했다.", true, "맞아요. 그래서 롤스는 분배의 ‘기준’보다 공정한 ‘절차’에 주목했어요."], ["p", "자, 케이크 한 판을 7명이 나눠야 해. 🎂 어떻게 나누면 공정할까?"], ["quiz", "롤스가 말한 공정하게 케이크 나누는 방법은?", ["배고픈 순서대로 크게", "도덕 점수 높은 순서대로", "자른 사람이 맨 마지막 조각을 갖기"], 2, "정답! 자기가 마지막에 남은 조각을 갖게 되면, 자르는 사람은 최대한 똑같이 자르겠죠?"], ["quote", "한 사람이 케이크를 자르고 다른 사람들이 먼저 집어 간 뒤 그가 마지막 조각을 갖게 하면, 그는 케이크를 똑같이 자를 것이다. 그래야 자신에게도 가능한 최대의 몫이 보장되기 때문이다.", "롤스, 『정의론』에서", "절차를 공정하게 짜 놓으면 결과도 공정해진다는 생각이에요. 이걸 절차적 정의라고 해요."], ["term", "절차적 정의", "분배 기준보다 분배하는 절차와 과정이 공정한지를 중시하는 정의관. 절차가 공정하면 결과도 정의롭다고 봐요."], ["p", "이제 진짜 상상 실험! 모두가 <b>무지의 베일<\/b>을 쓰고 사회의 규칙을 정한다고 해 보자. 🎭"], ["term", "무지의 베일", "내가 부자인지 가난한지, 어떤 능력과 성별·인종인지 모르게 가리는 상상의 베일. 나에게만 유리한 규칙을 못 만들게 해요."], ["me", "내가 누가 될지 모르면… 혹시 제일 힘든 사람이 될 수도 있으니까 그 사람도 챙기는 규칙을 고르겠네요!"], ["p", "바로 그거야! 👏 이런 상황을 나는 <b>원초적 입장<\/b>이라고 불러. 거기서 사람들은 두 가지 원칙에 합의할 거야."], ["p", "① 모든 사람은 기본적인 자유를 똑같이 누린다. ② 불평등이 있다면, 가장 어려운 사람에게 가장 큰 이익이 되고, 누구에게나 기회가 열려 있어야 한다."], ["quote", "제1 원칙이 제2 원칙보다 우선한다. 평등한 기본적 자유를 침해하는 것은 더 큰 사회적·경제적 이익으로도 정당화되거나 보상될 수 없다.", "롤스, 『정의론』에서", "돈을 더 벌게 해 준다고 해도 내 기본 자유(말할 자유, 생각할 자유 등)를 빼앗을 수는 없다는 말이에요."], ["mission", "롤스가 되어 네 남매에게 조언하기", "어머니가 남긴 빚 6,000만 원을 네 남매가 갚아야 해요.\n· 첫째(48세, 의사, 혼자 삶, 연 1억 원): “1/4씩 똑같이 나누자.”\n· 둘째(45세, 회사원, 4인 가족 외벌이, 연 4천만 원): “가족 수와 버는 사람 수를 따지자.”\n· 셋째(40세, 공무원, 맞벌이, 연 8천만 원): “그건 불공평해!”\n· 막내(35세, 계약직, 남편 실직, 연 2천만 원): “소득에 비례해서 나누자.”", "무지의 베일을 떠올리며 롤스의 입장에서 조언해 보세요.", "모두가 자신이 몇째인지, 직업과 소득이 어떤지 모른다고 상상해 보세요. 똑같이 1/4씩 하자고 정했는데 내가 막내라면? 무지의 베일을 쓰면 우리는 최악의 처지를 생각하게 되고, 가장 형편이 어려운 막내를 가장 배려하는 방법을 고르게 될 거예요. 예를 들어 소득에 따라 나누되 막내의 부담을 가장 적게 하는 방식이에요."], ["end", "내가 누가 될지 모를 때 고르는 규칙, 그것이 공정한 규칙이다."]];
</script>
