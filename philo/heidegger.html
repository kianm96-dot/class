window.WHO={"id": "heidegger", "name": "하이데거", "emoji": "⏳", "color": "#a777e3", "tags": ["실존주의", "죽음을 향한 존재", "선구"]};
window.CHAT=[["p", "Guten Tag! 나는 독일 철학자 하이데거야. 『존재와 시간』이라는, 아주 두꺼운 책을 썼지. ⏳"], ["p", "깜짝 퀴즈부터! 세상 누구도 절대 피할 수 없고, 남이 대신해 줄 수도 없는 건 뭘까?"], ["quiz", "누구도 피할 수 없고 대신할 수도 없는 것은?", ["시험", "죽음", "사춘기"], 1, "정답은 ‘죽음’이에요. (시험도 피하고 싶지만요 😅)"], ["p", "조금 무거운 주제지? 하지만 끝까지 들어 봐. 오히려 지금을 반짝이게 만드는 이야기야."], ["p", "19세기까지 서양은 이성과 과학을 앞세웠어. 그런데 사람을 기계 부품처럼 여기는 문제가 생겼지."], ["p", "그래서 등장한 게 <b>실존주의<\/b>야. “인간 일반”이 아니라 <b>지금 여기 있는 바로 나<\/b>의 삶을 묻는 철학이지."], ["term", "실존(實存)", "지금 여기에 있는 구체적인 개인의 존재. 실존주의는 정해진 본질보다 스스로 선택하고 책임지는 주체적인 삶을 강조해요."], ["me", "그럼 죽음은 왜 생각하라는 거예요? 무섭기만 한데요…"], ["p", "나는 인간을 <b>죽음을 향한 존재<\/b>라고 했어. 사람들은 “언젠가 죽지. 그런데 지금은 아니야~” 하며 그 사실을 슬쩍 덮어 버려."], ["quote", "사람들은 말한다. “죽음은 확실히 온다. 그러나 지금 당장은 아니다.” 그들은 ‘그러나’라는 말로 죽음이 어느 순간에든 올 수 있다는 확실성을 덮어 버린다.", "하이데거, 『존재와 시간』에서", "“나중 일이야” 하고 미루면 삶에 끝이 있다는 걸 잊고, 오늘을 그냥 흘려보내게 돼요."], ["p", "그래서 나는 삶의 끝 앞으로 미리 달려가 보라고 했어. 이걸 <b>죽음으로의 선구<\/b>라고 해."], ["term", "선구(先驅)", "삶의 끝(죽음) 앞으로 미리 달려가 마주해 보는 것. 내 삶이 하나뿐이고 끝이 있다는 걸 깨닫는 계기가 돼요."], ["p", "삶에는 끝이 있고(유한성), 단 한 번뿐이야(일회성). 이걸 깨달으면 “정말 소중한 게 뭐지?” 진지하게 묻게 돼."], ["ox", "하이데거는 죽음을 떠올리면 두렵기만 하니 생각하지 않는 것이 좋다고 했다.", false, "반대예요. 죽음을 미리 자각할 때 삶의 소중함과 의미를 깨닫는다고 했어요."], ["mission", "오늘이 내 삶의 마지막 날이라면", "어느 유명한 기업가가 대학 졸업식에서 이렇게 말했어요.\n“저는 33년 동안 매일 아침 거울을 보며 물었습니다. ‘오늘이 내 인생의 마지막 날이라면, 오늘 하려던 일을 할 것인가?’ … 우리의 삶은 영원하지 않습니다. 그러니 삶을 낭비하지 마세요.”", "오늘이 마지막 날이라면 나는 남은 시간을 어떻게 보낼지 써 보세요.", "어제 숙제 때문에 괜히 부모님께 짜증 낸 게 가장 먼저 떠올라요. 꼭 사과하고 싶어요. 그리고 바쁘다는 핑계로 못 찾아뵌 할머니께 가서 “사랑해요”라고 말하고 싶어요. 지금 이 순간이 얼마나 소중한지 알게 됐어요."], ["end", "끝이 있다는 걸 알 때, 지금 이 순간이 가장 소중해진다."]];
