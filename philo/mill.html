<script>
window.WHO={"id": "mill", "name": "밀", "emoji": "📣", "color": "#4a9eff", "tags": ["공리주의", "자유론", "표현의 자유"]};
window.CHAT=[["p", "Hello! 나는 존 스튜어트 밀이야. 세 살에 그리스어를 배웠다는 소문이 있는데… 사실이야. 😎"], ["p", "나는 스승 벤담에게 <b>공리주의<\/b>를 배웠어. 최대한 많은 사람이 최대한 행복해지는 쪽으로 행동하자는 생각이지."], ["term", "공리주의", "행동이 옳은지 그른지를 사람들의 이익과 행복을 얼마나 늘리는지로 판단하는 생각. “최대 다수의 최대 행복”"], ["quiz", "A 행동은 2명, B 행동은 6명을 행복하게 한다. 공리주의라면?", ["A를 고른다", "B를 고른다", "아무것도 하지 않는다"], 1, "맞아요. 더 많은 사람에게 행복을 주는 B를 고르라고 할 거예요."], ["p", "그런데 나는 벤담 선생님과 조금 달라. 행복에도 <b>질<\/b>이 있다고 봤거든."], ["quote", "만족한 돼지보다 불만족한 인간이 되는 것이 낫고, 만족한 바보보다 불만족한 소크라테스가 되는 것이 낫다.", "밀, 『공리주의』", "배부르고 편한 즐거움보다, 생각하고 배우는 정신적 즐거움이 더 값지다는 말이에요."], ["me", "그럼 게임보다 독서가 더 좋은 행복이라는 거예요…? 🎮📚"], ["p", "하하, 게임도 즐겁지! 다만 사람은 더 깊은 즐거움을 알아볼 줄 아는 존재라는 거야."], ["p", "내가 더 강조한 건 <b>자유<\/b>야. 사람들이 자유롭게 자기 개성과 재능을 펼칠 때 사회도 발전해."], ["p", "특히 <b>표현의 자유<\/b>! 어떤 의견도 함부로 입을 막아서는 안 돼."], ["quote", "어떤 의견을 침묵시키는 것은 인류 전체에게서 중요한 것을 빼앗는 일이다. 그 의견이 옳다면 오류를 진리로 바꿀 기회를, 틀렸다면 오류와 부딪치며 진리를 더 분명히 알 기회를 빼앗는다.", "밀, 『자유론』에서", "옳은 의견을 막으면 진리를 못 알게 되고, 틀린 의견을 막아도 토론하며 진리를 더 또렷하게 알 기회를 잃어요."], ["p", "한때는 모두가 “태양이 지구를 돈다(천동설)”고 믿었잖아. 반대 의견을 막았다면 지동설은 영영 묻혔을지도 몰라. 🌍☀️"], ["me", "그럼 아무 말이나 다 해도 돼요? 악플도요?"], ["p", "아니! 자유에도 선이 있어. <b>다른 사람에게 해를 끼치지 않는 범위<\/b>에서만 자유를 누릴 수 있어. 이걸 해악의 원리라고 해."], ["ox", "밀은 어떤 경우에도, 남에게 해를 끼치더라도 자유가 보장되어야 한다고 했다.", false, "아니에요. 타인에게 해를 끼치지 않는 범위에서만 자유가 보장된다고 했어요."], ["mission", "밀이 되어 필기 고쳐 주기", "김도덕의 필기 〈밀의 자유론〉\n1. 우리는 자기 의견을 자유롭게 표현할 수 있어야 한다.\n2. 어떤 의견도 억압하면 안 된다.\n   1) 그 의견이 진리일 수 있기 때문이다.\n   2) 그 의견이 명백히 틀렸을 때는 발언권을 가질 수 없다.\n3. 밀에 따르면 자유는 언제나, 어디서나, 누구에게나 보장된다.", "틀린 곳 두 군데를 찾아 바르게 고치고, 까닭을 써 보세요.", "2-2) 틀린 의견이라도 표현의 자유를 보장해야 한다. 자유로운 토론에서 고쳐질 수 있고, 틀린 의견을 반박하는 과정에서 진리가 더 분명해지기 때문이다.\n3) 밀은 다른 사람에게 해를 끼칠 때는 자유를 누릴 수 없다고 했다. 해를 끼치지 않는 범위에서 표현의 자유가 있다."], ["end", "틀린 의견도 말할 자유가 있다. 단, 남을 해치지 않는 범위에서."]];
</script>
