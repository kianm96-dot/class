<script>
window.WHO={"id": "socrates", "name": "소크라테스", "emoji": "🏛️", "color": "#ff7a6b", "tags": ["너 자신을 알라", "문답법", "지덕복합일"]};
window.CHAT=[["p", "안녕! 나는 소크라테스야. 2,400년 전쯤 그리스 아테네에 살았지. 🏛️"], ["p", "나는 책을 한 권도 쓰지 않았어. 대신 광장(아고라)에서 사람들을 붙잡고 질문을 던졌지."], ["term", "아고라", "고대 아테네의 광장. 시민들이 모여 정치·재판·장사·수다까지 다 하던 곳이에요."], ["me", "질문만 했다고요? 그게 철학이에요? 🤔"], ["p", "그럼! 예를 들어 “용기가 뭐야?”라고 물으면 사람들은 “전쟁에서 도망치지 않는 거요!”라고 해."], ["p", "그럼 나는 다시 묻지. “그럼 작전상 물러나는 장군은 겁쟁이인가?” 그러면 다들 말이 막혀. 😅"], ["p", "이렇게 묻고 답하다 보면 “아, 나는 안다고 생각했는데 사실 몰랐구나!” 깨닫게 돼. 이게 나의 <b>문답법<\/b>이야."], ["quiz", "소크라테스가 말한 “너 자신을 알라”는 무슨 뜻일까?", ["내 MBTI를 정확히 알아라", "내가 모른다는 사실(무지)을 깨달아라", "남보다 똑똑해져라"], 1, "정답! 자신이 모른다는 걸 아는 것에서 진짜 앎이 시작된다는 뜻이에요."], ["p", "내 생각은 이래. 무엇이 옳은지 <b>진짜로 아는<\/b> 사람은 옳게 행동할 수밖에 없어."], ["p", "그리고 옳게 사는 사람, 곧 덕 있는 사람은 결국 행복해져. 앎 = 덕 = 행복! 이걸 <b>지덕복합일<\/b>이라고 불러."], ["term", "지덕복합일설", "참된 앎(知)과 덕(德)과 행복(福)이 하나로 이어진다는 생각. “알면 실천한다, 실천 못 하는 건 제대로 모르기 때문”이라는 지행합일로 이어져요."], ["me", "근데 알면서도 안 하는 경우 많은데요? 숙제라든가… 😇"], ["p", "하하, 그건 내 생각엔 숙제가 왜 좋은지 아직 <b>진짜로<\/b> 모르는 거야. 그래서 늘 스스로를 돌아봐야 해."], ["quote", "우리가 가장 중히 여겨야 할 것은 사는 것이 아니라 훌륭하게 사는 것입니다. …… 검토하지 않은 삶은 사람에게 살 가치가 없습니다.", "플라톤, 『소크라테스의 변론』·『크리톤』에서", "그냥 하루하루 버티는 삶보다, “내가 지금 옳게 하고 있나?”를 묻고 돌아보는 삶이 진짜 가치 있다는 말이에요."], ["p", "나는 이 생각을 지키다가 사형 선고를 받았어. 도망칠 기회도 있었지만, 옳지 않은 방법으로 살고 싶진 않았거든."], ["ox", "소크라테스에 따르면 덕이 있는 사람은 결국 행복한 삶을 살게 된다.", true, "맞아요. 앎 → 덕의 실천 → 행복으로 이어진다고 보았어요."], ["mission", "소크라테스의 눈으로 행복한 사람 찾기", "버스에 빈자리가 하나 있어 앉아 가던 두 학생. 다리에 깁스를 한 학생이 탔어요.\n· 학생 1: 자는 척하며 양보하지 않고 단잠을 잤다. “잠을 보충해서 다행!”\n· 학생 2: 잠시 고민했지만 자리를 양보했다. “올바른 행동을 하는 게 더 좋아!”", "소크라테스라면 누구를 행복한 사람이라고 할까요? 까닭도 써 보세요.", "학생 2. 학생 1은 자기에게 이득인 것만 생각해서 배려라는 덕을 모르는 사람이에요. 학생 2는 자기 행동을 돌아보고 옳은 것을 알고 실천했어요. 소크라테스는 이렇게 덕 있는 삶이 행복으로 이어진다고 보았어요."], ["end", "모른다는 걸 아는 것에서 시작해, 돌아보며 옳게 사는 삶이 행복이다."]];
</script>
