window.WHO={"id": "jeong", "name": "정약용", "emoji": "🏗️", "color": "#e0803a", "tags": ["실학", "신독", "사의재"]};
window.CHAT=[["p", "반갑소! 나는 다산 정약용이오. 수원 화성을 지을 때 <b>거중기<\/b>를 설계했지. 🏗️"], ["term", "거중기", "도르래를 이용해 무거운 돌을 적은 힘으로 들어 올리는 기계. 덕분에 화성 공사 기간을 크게 줄였어요."], ["me", "와, 철학자인데 기계도 만들어요?"], ["p", "그게 바로 <b>실학<\/b>이라오. 전쟁(임진왜란·병자호란) 뒤 백성들 삶이 너무 힘들었소. 그런데 학문이 이론만 따지고 있으니 답답했지."], ["term", "실학(實學)", "백성의 실제 생활에 도움이 되는 쓸모 있는 학문을 하자는 조선 후기의 흐름. 홍대용·박지원·박제가 등도 함께했어요."], ["quiz", "정약용이 거중기를 만든 일에서 알 수 있는 실학의 특징은?", ["이론만 깊이 연구한다", "실생활에 쓸모 있는 학문을 중시한다", "외국 문물을 무조건 거부한다"], 1, "맞아요! 실학은 실용(실제로 쓰이는 쓸모)을 중시했어요."], ["p", "나는 18년 동안 전라도 강진에서 귀양살이를 했소. 그때 책을 500권 가까이 썼다오. 📚"], ["p", "『목민심서』에는 관리가 지켜야 할 청렴과 도리를, 『흠흠신서』에는 사람의 목숨을 다루는 재판을 신중히 하라는 내용을 담았지."], ["quote", "오직 하늘만이 사람을 살리고 죽이는데, 사람이 그 권한을 쥐고서도 두려워할 줄 모른다. …… 백성이 울부짖는 소리를 듣고도 구하려 하지 않으니 이는 매우 큰 죄악이다.", "정약용, 『흠흠신서』에서", "‘흠흠’은 “신중하고 또 신중하라”는 뜻. 백성의 생명을 가볍게 다루지 말라는 경고예요."], ["me", "그럼 선생님이 생각하는 도덕적인 사람은 어떤 사람이에요?"], ["p", "사람은 선하고자 하면 선할 수 있고, 악하고자 하면 악할 수도 있소. 스스로 <b>선택<\/b>하는 존재지. 그러니 매일 선을 골라 실천해야 덕이 쌓인다오."], ["p", "그때 필요한 자세가 <b>신독(愼獨)<\/b>이오."], ["term", "신독(愼獨)", "홀로 있을 때, 남이 모르는 일에도 마음과 행동을 삼가고 조심하는 것."], ["quote", "요즘 사람들은 신독을 분명히 알지 못해, 속임수나 거짓된 행동을 하면서 남들이 모를 것이라고 생각한다.", "정약용, 『심경밀험』에서", "“아무도 안 보니까 괜찮아”가 아니라, 하늘과 내 양심은 알고 있다는 마음으로 행동하라는 말이에요."], ["ox", "신독은 다른 사람이 보고 있을 때 특히 행동을 조심하는 것이다.", false, "아니에요. 남이 보지 않는 혼자 있을 때에도 조심하는 것이 신독이에요."], ["p", "나는 강진에서 지낸 방에 <b>사의재(四宜齋)<\/b>라는 이름을 붙였소. ‘마땅히 해야 할 네 가지’를 지키는 방이라는 뜻이지."], ["mission", "나만의 ‘사의’ 만들기", "정약용의 사의재(四宜齋)\n· 생각은 맑아야 하니, 흐려지면 곧 맑게 한다.\n· 용모는 단정해야 하니, 흐트러지면 곧 바로 한다.\n· 말은 적어야 하니, 많아지면 곧 그친다.\n· 행동은 무거워야 하니, 가벼워지면 곧 천천히 한다.", "도덕적인 사람이 되기 위해 내가 마땅히 지킬 네 가지(사의)를 만들어 보세요.", "생각은 깊게 — 떠오른 생각이 바람직한지 되돌아본다.\n말은 곱게 — 남에게 상처 주는 말은 꺼내지 않는다.\n행동은 신중하게 — 생각을 정리한 뒤 움직인다.\n마음은 따뜻하게 — 나만 생각하지 않고 남을 먼저 헤아린다."], ["end", "아무도 보지 않을 때의 나가 진짜 나다. 오늘도 선을 선택하자."]];
</script>
