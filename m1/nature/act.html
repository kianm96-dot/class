<section class="panel" data-lesson="1">
  <h1>어디까지 고려할까</h1>
  <p class="q">생명체를 도덕적으로 고려하는 이유를 구분하고, 동물원 존폐를 토의해 보자.</p>
  <script type="application/json" class="kit">[{"k": "vote", "h": "함부로 대해도 된다고 생각하는 것은?", "opts": ["🪨 돌멩이", "🌳 나무", "🐟 물고기", "🦟 모기", "🐕 강아지", "없다"]}, {"k": "sort", "h": "어떤 이유일까? (176~178쪽)", "bins": ["인간에게 도움", "동물도 고통", "생명 그 자체"], "cards": [["식물을 기르면 마음이 안정된다", 0, "인성 함양"], ["물고기도 위험을 감지하는 기관이 있다", 1, "고통을 느끼는 능력"], ["풀 한 포기도 살려고 애쓴다", 2, "생명 외경"], ["동식물이 공기와 물을 맑게 한다", 0, "삶의 토대"], ["인간의 고통과 동물의 고통을 평등하게 고려해야 한다", 1, "싱어"], ["곤충이 다칠까 봐 창문을 닫는다", 2, "슈바이처"]]}, {"k": "vote", "h": "동물원 존폐 토의 · 나는 누구를 지지할까? (179쪽)", "opts": ["동우 · 가두는 건 옳지 않다", "명이 · 고통스러우니 없애자", "서원 · 동물 복지 동물원은 필요하다"]}, {"k": "timer", "min": 4, "label": "다른 입장 친구와 이야기"}, {"k": "sort", "h": "➕ 어떤 입장일까?", "bins": ["인간", "동물", "생명", "생태"], "cards": [["동물을 학대하면 사람이 잔인해지니 나쁘다", 0, "인간 중심주의(칸트)"], ["고통을 느끼는 존재라면 똑같이 고려해야 한다", 1, "동물 중심주의(싱어)"], ["풀 한 포기도 존중해야 한다", 2, "생명 중심주의(슈바이처)"], ["늑대를 없애면 숲이 무너진다", 3, "생태 중심주의(레오폴드)"]]}]</script>
</section>
<section class="panel" data-lesson="2">
  <h1>생명 존중 서약</h1>
  <p class="q">개인적·사회적 실천 방법을 고르고 나만의 서약서를 만들어 보자.</p>
  <script type="application/json" class="kit">[{"k": "sort", "h": "어떤 실천일까? (182~184쪽)", "bins": ["동물 학대 방지", "반려 식물", "식습관", "의생활", "사회적 실천"], "cards": [["아픈 반려견을 제때 병원에 데려간다", 0, "치료 소홀도 학대"], ["화분에 알맞은 햇볕을 준다", 1, "반려 식물 보살피기"], ["동물 복지 인증 달걀을 고른다", 2, "식습관"], ["인조털 외투를 입는다", 3, "의생활"], ["멸종 위기 동물 보호 캠페인에 참여한다", 4, "인식 개선"], ["동물 보호법 개정을 제안한다", 4, "법과 제도"]]}, {"k": "ox", "h": "야생 동물과 공존하기 (185쪽)", "items": [["버려진 새끼 새는 바로 집에 데려와 돌봐야 한다.", false, "먼저 둥지를 찾고, 없으면 한 시간쯤 숨어서 부모 새를 기다린다."], ["수달 사진을 찍으려고 수풀을 헤치면 수달의 집을 부수는 것과 같다.", true, "적당한 거리 두기."], ["고라니가 마을로 내려오는 것은 살던 곳과 먹이가 줄었기 때문이다.", true, "사람의 개발이 원인."]]}, {"k": "write", "h": "나의 생명 존중 서약서", "prompts": [["첫째, 나는", "길고양이를 괴롭히지 않고 아프면 보호소에 알리겠다."], ["둘째, 나는", "반려동물을 맞이하기 전 10년 뒤까지 생각하겠다."], ["셋째, 나는", "동물 복지 인증 제품을 살펴보겠다."]]}]</script>
